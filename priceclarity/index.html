function build(){document.title=T.title;document.querySelectorAll('[data-text]').forEach(el=>el.textContent=T[el.dataset.text]);$('version').textContent=T.version.replace('{version}',APP_VERSION);$('dismiss').textContent='×';$('dismiss').ariaLabel=T.dismiss;const nav=document.querySelector('.tabs');nav.ariaLabel=T.tabLabel;nav.innerHTML=['price','packages','offer'].map((key,i)=>`<button role="tab" id="tab-${key}" aria-controls="panel-${key}" data-tab="${key}">${esc(T.tabs[i])}</button>`).join('');$('mainFields').innerHTML=['ownerIncome','overhead','hoursPerWeek','projectHours','directCost'].map(k=>field('main',k,state.main[k],T.helpers[k], '',k==='directCost')).join('');$('advancedFields').innerHTML=['weeksPerYear','nonBillable','taxReserve','targetMargin','paymentFee','projectBuffer','premiumUplift'].map(k=>field('main',k,state.main[k],T.helpers[k])).join('');$('packages').innerHTML=state.packages.map((p,i)=>`<article class="card package ${i===1?'featured':''}">${i===1?`<span class="ribbon">${T.popular}</span>`:''}<div class="eyebrow">${String(i+1).padStart(2,'0')}</div><h3>${T.tierNames[i]}</h3><label for="description-${i}">${T.labels.description}</label><textarea id="description-${i}" data-group="packages" data-index="${i}" data-key="description" maxlength="500">${esc(p.description)}</textarea><div class="fields">${['hours','directCost','premiumFactor'].map(k=>field('packages',k,p[k],'',i)).join('')}</div><div class="package-results" id="packageResult-${i}" aria-live="polite"></div></article>`).join('');const r=calculate(state);$('offerFields').innerHTML=['sellingPrice','deliveryHours','directCosts','volume','fee','fixedOverhead'].map(k=>field('offer',k,state.offer[k]??(k==='fee'?state.main.paymentFee:state.main.overhead/12))).join('');render();selectTab(state.activeTab,false)}
function render(){const r=calculate(state);$('welcome').hidden=state.welcomeDismissed;$('saveStatus').textContent=storageOK?T.saved:T.unavailable;$('validation').innerHTML=r.error?`<p class="warning">${T[r.error]}</p>`:r.warning?`<p class="warning">${T.reserveWarning}</p>`:'';if(r.error){$('results').innerHTML=`<div class="hero"><h2>${T[r.error]}</h2></div>`;$('offerResults').innerHTML=`<h2>${T[r.error]}</h2>`;state.packages.forEach((p,i)=>$('packageResult-'+i).textContent=T[r.error]);$('mobilePrice').textContent='—';$('mobileHealth').textContent='';return}const values=[money(r.clientRate),money(r.sustainableRate),money(r.requiredRevenue,0),count(r.billableHours),money(r.profit),percent(r.projectMargin),money(r.monthlyTarget),count(r.projectsPerMonth)];$('results').innerHTML=`<div class="hero"><div class="eyebrow">${T.brand}</div><p class="hero-label">${T.heroLabel}</p><div class="price">${money(r.recommendedPrice)}</div>${badge(r.health)}</div><div class="range">${[r.minimumPrice,r.recommendedPrice,r.premiumPrice].map((v,i)=>`<div class="${i===1?'selected':''}"><small>${[T.minimum,T.recommended,T.premium][i]}</small><strong>${money(v)}</strong></div>`).join('')}</div><div class="metrics">${values.map((v,i)=>metric(T.metrics[i],v)).join('')}</div><div class="health-box">${badge(r.health)}<p>${T.health[r.health]}</p></div><div class="capacity">${T.capacity.replace('{value}',formatCurrency(r.capacity,'capacity'))}${r.capacity>1?`<p class="warning">${T.capacityWarning}</p>`:''}</div><p class="explain">${T.explainer}</p><details><summary>${T.how}</summary><ol class="formula-list">${T.formulas.map(s=>`<li>${s}</li>`).join('')}</ol></details><p class="note">${T.note}</p>`;r.packages.forEach((p,i)=>$('packageResult-'+i).innerHTML=`<div class="price">${money(p.price)}</div>${badge(p.health)}<p>${T.profit}: <strong>${money(p.profit)}</strong></p><p>${T.margin}: <strong>${percent(p.margin)}</strong></p><p class="print-only">${esc(state.packages[i].description)}</p>`);const o=r.offer;const ov=[money(o.labor),money(o.processing),money(o.profit),percent(o.margin),money(o.monthlyRevenue),money(o.contribution),money(o.net)];$('offerResults').innerHTML=o.valid?`<h2>${T.tabs[2]}</h2><div class="metrics">${ov.map((v,i)=>metric(T.offerMetrics[i],v)).join('')}</div><div class="health-box">${badge(o.health)}<p>${T.health[o.health]}</p></div><p class="verdict">${o.net>=0?T.offerPositive:T.offerNegative}</p>`:`<h2>${T.offerZero}</h2>`;for(const [k,v]of [['fee',o.fee],['fixedOverhead',o.overhead]]){const inherited=state.offer[k]===null;const el=$('offer-'+k);if(inherited&&document.activeElement!==el)el.value=v;$('offer-'+k+'-inherit').textContent=inherited?T.inherit:'';document.querySelector(`[data-follow="${k}"]`).hidden=inherited}$('mobilePrice').textContent=money(r.recommendedPrice);$('mobileHealth').innerHTML=badge(r.health)}
function selectTab(key,persist=true){state.activeTab=key;for(const k of ['price','packages','offer']){const selected=k===key;$('panel-'+k).hidden=!selected;$('tab-'+k).setAttribute('aria-selected',selected);$('tab-'+k).tabIndex=selected?0:-1}$('mobileBar').hidden=key!=='price';if(persist)scheduleSave()}
const limitTimers=new Map();
document.addEventListener('input',e=>{const el=e.target,g=el.dataset.group,k=el.dataset.key;if(!g)return;const target=g==='packages'?state.packages[Number(el.dataset.index)]:state[g];if(k==='description')target[k]=el.value;else{const note=$(el.id+'-limit');clearTimeout(limitTimers.get(el.id));limitTimers.delete(el.id);note.textContent='';note.hidden=true;const above=Number(el.value)>LIMITS[k],v=number(el.value,k);target[k]=v;if(el.value!==''&&(Number(el.value)<0||above))el.value=v;if(above){const limit=el.classList.contains('money')?formatCurrency(LIMITS[k],0):count(LIMITS[k]);note.textContent=T.maximum.replace('{limit}',limit);note.hidden=false;limitTimers.set(el.id,setTimeout(()=>{note.textContent='';note.hidden=true;limitTimers.delete(el.id)},4000))}}render();scheduleSave()});document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab)selectTab(tab.dataset.tab);const follow=e.target.closest('[data-follow]');if(follow){state.offer[follow.dataset.follow]=null;render();scheduleSave()}});document.querySelector('.tabs').addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[role=tab]')],i=tabs.indexOf(document.activeElement);if(i<0)return;let j;if(e.key==='ArrowRight')j=(i+1)%3;else if(e.key==='ArrowLeft')j=(i+2)%3;else if(e.key==='Home')j=0;else if(e.key==='End')j=2;else return;e.preventDefault();selectTab(tabs[j].dataset.tab);tabs[j].focus()});$('dismiss').onclick=()=>{state.welcomeDismissed=true;render();scheduleSave()};$('reset').onclick=()=>{$('confirmReset').hidden=false;$('confirm').focus()};$('cancel').onclick=()=>{$('confirmReset').hidden=true;$('reset').focus()};$('confirm').onclick=()=>{state=defaults();clearTimeout(saveTimer);save();build();$('confirmReset').hidden=true;$('reset').focus()};$('print').onclick=()=>window.print();$('mobileBar').onclick=()=>$('results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);save()});build();
</script></body></html>
